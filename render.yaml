# Render Blueprint — one-click backend deploy.
# In Render: New + -> Blueprint -> pick the PitchPerfect repo. It reads this file.
# You'll be prompted to fill GROQ_API_KEY (marked sync:false so it's never in git).
services:
  - type: web
    name: pitchperfect-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false          # set this in the Render dashboard (kept out of git)
      - key: PYTHON_VERSION
        value: "3.12"
